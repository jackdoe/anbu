<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANBU: Python Coding Challenges</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/matifandy8/NeoBrutalismCSS/dist/index.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Lexend+Mega:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.54.0/min/vs/loader.js"></script>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.28.3/full/pyodide.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Lexend Mega', sans-serif;
      background: #ffd700;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .header {
      background: #4a90e2;
      border-bottom: 5px solid #000;
      padding: 15px 20px;
      box-shadow: 0 5px 0 #000;
    }

    .header h1 {
      font-size: 1.3rem;
      color: #000;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .header-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .challenge-nav {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .category-filter {
      background: #fff;
      border: 4px solid #000;
      padding: 8px 16px;
      font-family: 'Lexend Mega', sans-serif;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 4px 4px 0 #000;
      transition: all 0.1s;
      text-transform: uppercase;
      min-width: 150px;
    }

    .category-filter:hover {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #000;
    }

    .category-filter:focus {
      outline: none;
      border-color: #4ecdc4;
    }

    .nav-btn {
      width: 50px;
      height: 50px;
      background: #fff;
      border: 4px solid #000;
      cursor: pointer;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 4px 4px 0 #000;
      transition: all 0.1s;
    }

    .nav-btn:hover:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #000;
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .challenge-counter {
      background: #fff;
      border: 4px solid #000;
      padding: 10px 20px;
      font-weight: bold;
      box-shadow: 4px 4px 0 #000;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
    }

    .mobile-action-buttons {
      display: none;
    }

    .btn {
      padding: 12px 24px;
      font-family: 'Lexend Mega', sans-serif;
      font-weight: bold;
      font-size: 14px;
      border: 4px solid #000;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 5px 5px 0 #000;
      transition: all 0.1s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 3px 3px 0 #000;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-reset {
      background: #fff;
      color: #000;
    }

    .btn-submit {
      background: #4ecdc4;
      color: #000;
    }

    .btn-games {
      background: #fff;
      color: #000;
    }

    .btn-help {
      background: #a9d3ab;
      color: #000;
      padding: 10px 18px;
      font-size: 13px;
    }

    .main-content {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      width: 380px;
      background: #f7f7f7;
      border-right: 5px solid #000;
      padding: 20px;
      overflow-y: auto;
      box-shadow: 5px 0 0 #000;
    }

    .sidebar h2 {
      font-size: 1.5rem;
      margin-bottom: 10px;
      color: #000;
    }

    .description {
      background: #fff;
      border: 4px solid #000;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 4px 4px 0 #000;
    }

    .test-cases h3 {
      margin-bottom: 15px;
      font-size: 1.1rem;
    }

    .test-case {
      background: #fff;
      border: 4px solid #000;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 3px 3px 0 #000;
      font-size: 0.85rem;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .test-case code {
      word-wrap: break-word;
      overflow-wrap: break-word;
      white-space: pre-wrap;
      display: inline-block;
      max-width: 100%;
    }

    .test-input {
      color: #ff8c42;
      font-weight: bold;
    }

    .test-expected {
      color: #4ecdc4;
      font-weight: bold;
    }

    .loading-indicator {
      background: #ffd700;
      border: 4px solid #000;
      padding: 12px;
      margin-top: 15px;
      box-shadow: 3px 3px 0 #000;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .editor-section {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .editor-tab {
      background: #2d2d2d;
      border-bottom: 4px solid #000;
      padding: 10px 20px;
      font-weight: bold;
      color: #ffd700;
      font-size: 0.9rem;
    }

    #editor {
      flex: 1;
      border-right: 5px solid #000;
    }

    .output-section {
      height: 300px;
      background: #1e1e1e;
      border-top: 5px solid #000;
      overflow-y: auto;
      box-shadow: 0 -5px 0 #000;
    }

    .output-header {
      background: #4ecdc4;
      border-bottom: 4px solid #000;
      padding: 12px 20px;
      font-weight: bold;
      color: #000;
      text-transform: uppercase;
    }

    .output-content {
      padding: 20px;
      color: #fff;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      white-space: pre-wrap;
    }

    .test-results {
      padding: 20px;
    }

    .test-result {
      background: #fff;
      border: 4px solid #000;
      padding: 15px;
      margin-bottom: 12px;
      box-shadow: 4px 4px 0 #000;
    }

    .test-result.passed {
      background: #4ecdc4;
    }

    .test-result.failed {
      background: #ffb3b3;
    }

    .test-result-title {
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 1rem;
    }

    .test-result-details {
      font-size: 0.85rem;
      line-height: 1.6;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .test-result-details div {
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    /* Games Modal Styles */
    .games-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .games-container {
      background: #ffd700;
      border: 5px solid #000;
      box-shadow: 10px 10px 0 #000;
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
    }

    .games-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 4px solid #000;
    }

    .games-header h2 {
      font-size: 1.8rem;
      margin: 0;
    }

    .close-btn {
      width: 50px;
      height: 50px;
      background: #ff8c42;
      border: 4px solid #000;
      cursor: pointer;
      font-size: 24px;
      font-weight: bold;
      box-shadow: 4px 4px 0 #000;
      transition: all 0.1s;
    }

    .close-btn:hover {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #000;
    }

    .games-menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .game-btn {
      background: #fff;
      border: 4px solid #000;
      padding: 30px;
      cursor: pointer;
      box-shadow: 6px 6px 0 #000;
      transition: all 0.1s;
      font-family: 'Lexend Mega', sans-serif;
    }

    .game-btn:hover {
      transform: translate(3px, 3px);
      box-shadow: 3px 3px 0 #000;
    }

    .game-icon {
      font-size: 4rem;
      margin-bottom: 10px;
    }

    .game-name {
      font-size: 1.2rem;
      font-weight: bold;
      color: #000;
    }

    .game-area {
      text-align: center;
    }

    .game-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 15px;
      background: #fff;
      border: 4px solid #000;
      box-shadow: 4px 4px 0 #000;
    }

    .btn-back {
      background: #fff;
      color: #000;
      padding: 10px 20px;
    }

    #gameScore {
      font-size: 1.2rem;
      font-weight: bold;
    }

    #gameCanvas {
      background: #fff;
      border: 4px solid #000;
      box-shadow: 6px 6px 0 #000;
      display: block;
      margin: 0 auto 20px;
    }

    #gameInstructions {
      background: #4ecdc4;
      border: 4px solid #000;
      padding: 15px;
      box-shadow: 4px 4px 0 #000;
      margin-top: 15px;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .game-over-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .game-over-box {
      background: #ffd700;
      border: 5px solid #000;
      box-shadow: 10px 10px 0 #000;
      padding: 40px;
      text-align: center;
      max-width: 400px;
    }

    .game-over-title {
      font-size: 2.5rem;
      margin-bottom: 20px;
      color: #000;
      text-transform: uppercase;
    }

    .game-over-message {
      font-size: 1.2rem;
      margin-bottom: 30px;
      color: #000;
    }

    .game-over-buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    .btn-restart {
      background: #4ecdc4;
      color: #000;
      padding: 12px 24px;
    }

    .btn-menu {
      background: #ff8c42;
      color: #000;
      padding: 12px 24px;
      font-size: 0.9rem;
    }

    .mobile-game-controls {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .control-row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .control-btn {
      width: 60px;
      height: 60px;
      background: #4a90e2;
      border: 4px solid #000;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 4px 4px 0 #000;
      transition: all 0.1s;
      font-weight: bold;
    }

    .control-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #000;
    }

    @media (min-width: 769px) {
      .mobile-game-controls {
        display: none !important;
      }
    }

    @media (max-width: 1024px) {
      .sidebar {
        width: 320px;
      }

      .header h1 {
        font-size: 1.5rem;
      }
    }

    @media (max-width: 768px) {
      body {
        overflow: auto;
      }

      .container {
        height: auto;
        min-height: 100vh;
      }

      .header {
        padding: 12px 15px;
      }

      .header h1 {
        font-size: 1rem;
        margin-bottom: 8px;
      }

      .header-controls {
        flex-direction: column;
        gap: 10px;
      }

      .challenge-nav {
        width: 100%;
        justify-content: center;
      }

      .category-filter {
        width: 100%;
        font-size: 12px;
        padding: 8px 12px;
      }

      .nav-btn {
        width: 45px;
        height: 45px;
        font-size: 18px;
      }

      .challenge-counter {
        padding: 8px 16px;
        font-size: 0.85rem;
      }

      .action-buttons {
        display: none;
      }

      .mobile-action-buttons {
        display: flex;
        gap: 10px;
        padding: 15px 20px;
        background: #f7f7f7;
        border-bottom: 5px solid #000;
        box-shadow: 0 5px 0 #000;
        flex-wrap: wrap;
      }

      .mobile-action-buttons .btn {
        padding: 10px 16px;
        font-size: 12px;
        flex: 1;
        min-width: 90px;
      }

      .main-content {
        flex-direction: column;
        overflow: visible;
      }

      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 5px solid #000;
        box-shadow: 0 5px 0 #000;
        height: auto;
        overflow-y: visible;
      }

      .sidebar h2 {
        font-size: 1.2rem;
      }

      .description {
        font-size: 0.9rem;
      }

      .test-cases h3 {
        font-size: 1rem;
      }

      .test-case {
        font-size: 0.8rem;
        padding: 10px;
      }

      .editor-section {
        min-height: 300px;
      }

      .editor-tab {
        padding: 8px 15px;
        font-size: 0.85rem;
      }

      #editor {
        border-right: none;
        min-height: 300px;
      }

      .output-section {
        height: auto;
        min-height: 200px;
      }

      .output-header {
        padding: 10px 15px;
        font-size: 0.9rem;
      }

      .output-content {
        padding: 15px;
        font-size: 13px;
      }

      .test-results {
        padding: 15px;
      }

      .test-result {
        padding: 12px;
        margin-bottom: 10px;
      }

      .test-result-title {
        font-size: 0.9rem;
      }

      .test-result-details {
        font-size: 0.8rem;
      }
    }

    @media (max-width: 480px) {
      .header {
        padding: 10px;
      }

      .header h1 {
        font-size: 0.85rem;
        letter-spacing: 1px;
      }

      .category-filter {
        font-size: 11px;
        padding: 6px 10px;
        border: 3px solid #000;
        box-shadow: 3px 3px 0 #000;
        min-width: 120px;
      }

      .nav-btn {
        width: 40px;
        height: 40px;
        font-size: 16px;
        border: 3px solid #000;
        box-shadow: 3px 3px 0 #000;
      }

      .challenge-counter {
        padding: 6px 12px;
        font-size: 0.75rem;
        border: 3px solid #000;
        box-shadow: 3px 3px 0 #000;
      }

      .mobile-action-buttons {
        padding: 12px 15px;
        border-bottom: 4px solid #000;
        box-shadow: 0 4px 0 #000;
        gap: 8px;
      }

      .mobile-action-buttons .btn {
        padding: 9px 14px;
        font-size: 11px;
        border: 3px solid #000;
        box-shadow: 4px 4px 0 #000;
        min-width: 80px;
      }

      .sidebar {
        padding: 15px;
      }

      .sidebar h2 {
        font-size: 1rem;
      }

      .description {
        font-size: 0.85rem;
        padding: 12px;
        border: 3px solid #000;
        box-shadow: 3px 3px 0 #000;
      }

      .test-cases h3 {
        font-size: 0.9rem;
      }

      .test-case {
        font-size: 0.75rem;
        padding: 8px;
        border: 3px solid #000;
        box-shadow: 2px 2px 0 #000;
      }

      .editor-tab {
        padding: 6px 12px;
        font-size: 0.85rem;
      }

      #editor {
        min-height: 250px;
      }

      .output-content {
        padding: 12px;
        font-size: 12px;
      }

      .test-result {
        padding: 10px;
        border: 3px solid #000;
        box-shadow: 3px 3px 0 #000;
      }

      .test-result-title {
        font-size: 0.85rem;
      }

      .test-result-details {
        font-size: 0.75rem;
      }

      .loading-indicator {
        font-size: 0.8rem;
        padding: 10px;
        border: 3px solid #000;
        box-shadow: 2px 2px 0 #000;
      }

      .games-modal {
        padding: 10px;
      }

      .games-container {
        padding: 15px;
        max-height: 95vh;
        border: 4px solid #000;
        box-shadow: 6px 6px 0 #000;
      }

      .games-header h2 {
        font-size: 1.2rem;
      }

      .close-btn {
        width: 40px;
        height: 40px;
        font-size: 20px;
        border: 3px solid #000;
        box-shadow: 3px 3px 0 #000;
      }

      .games-menu {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .game-btn {
        padding: 20px;
        border: 3px solid #000;
        box-shadow: 4px 4px 0 #000;
      }

      .game-icon {
        font-size: 3rem;
      }

      .game-name {
        font-size: 1rem;
      }

      .game-controls {
        flex-direction: column;
        gap: 10px;
        padding: 12px;
        border: 3px solid #000;
        box-shadow: 3px 3px 0 #000;
      }

      .btn-back {
        align-self: flex-start;
      }

      #gameScore {
        font-size: 1rem;
      }

      #gameCanvas {
        max-width: 100%;
        border: 3px solid #000;
        box-shadow: 4px 4px 0 #000;
      }

      #gameInstructions {
        font-size: 0.8rem;
        padding: 12px;
        border: 3px solid #000;
        box-shadow: 3px 3px 0 #000;
      }

      .control-btn {
        width: 55px;
        height: 55px;
        font-size: 20px;
        border: 3px solid #000;
        box-shadow: 3px 3px 0 #000;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <div class="header-controls">
        <div class="challenge-nav">
          <button class="nav-btn" id="prevBtn" onclick="prevChallenge()">◀</button>
          <div class="challenge-counter">
            #<span id="currentNum">1</span> / <span id="totalNum">1</span>
          </div>
          <button class="nav-btn" id="nextBtn" onclick="nextChallenge()">▶</button>
          <select class="category-filter" id="categoryFilter" onchange="filterByCategory()">
            <option value="all">All Categories</option>
          </select>
        </div>
        <div class="action-buttons">
          <button class="btn btn-games" onclick="openGames()">
            Games
          </button>
          <button class="btn btn-help" onclick="askClaude()">
            🤖 Help
          </button>
          <button class="btn btn-reset" onclick="resetChallenge()">
            Reset
          </button>
          <button class="btn btn-submit" id="submitBtn" onclick="submitCode()">
            Submit
          </button>
        </div>
      </div>
    </div>

    <div class="main-content">
      <div class="sidebar">
        <h2 id="challengeTitle">Challenge Title</h2>
        <div class="description" id="challengeDescription">
          Loading challenge...
        </div>

        <div class="test-cases">
          <h3>Test Cases:</h3>
          <div id="testCases"></div>
        </div>

        <div class="loading-indicator" id="loadingIndicator" style="display: none;">
          <span>Loading Python runtime...</span>
        </div>
      </div>

      <div class="mobile-action-buttons">
        <button class="btn btn-help" onclick="askClaude()">
          🤖 Help
        </button>
        <button class="btn btn-reset" onclick="resetChallenge()">
          Reset
        </button>
        <button class="btn btn-submit" id="submitBtnMobile" onclick="submitCode()">
          Submit
        </button>
      </div>

      <div class="editor-section">
        <div class="editor-tab">
          <span id="fileName">1.py</span>
        </div>
        <div id="editor"></div>
      </div>
    </div>

    <div class="output-section">
      <div class="output-header">Output</div>
      <div class="output-content" id="output"></div>
      <div class="test-results" id="testResults"></div>
    </div>
  </div>

  <!-- Games Modal -->
  <div id="gamesModal" class="games-modal" style="display: none;">
    <div class="games-container">
      <div class="games-header">
        <h2>🎮 Games</h2>
        <button class="close-btn" onclick="closeGames()">✕</button>
      </div>
      <div class="games-menu" id="gamesMenu">
        <button class="game-btn" onclick="startGame('snake')">
          <div class="game-icon">🐍</div>
          <div class="game-name">Snake</div>
        </button>
        <button class="game-btn" onclick="startGame('tetris')">
          <div class="game-icon">🧱</div>
          <div class="game-name">Tetris</div>
        </button>
        <button class="game-btn" onclick="startGame('breakout')">
          <div class="game-icon">🎯</div>
          <div class="game-name">Breakout</div>
        </button>
        <button class="game-btn" onclick="startGame('memory')">
          <div class="game-icon">🃏</div>
          <div class="game-name">Memory</div>
        </button>
        <button class="game-btn" onclick="startGame('spaceshooter')">
          <div class="game-icon">🚀</div>
          <div class="game-name">Space Shooter</div>
        </button>
      </div>
      <div class="game-area" id="gameArea" style="display: none;">
        <div class="game-controls">
          <button class="btn btn-back" onclick="backToMenu()">← Back</button>
          <div id="gameScore">Score: 0</div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="gameInstructions"></div>
        <div class="mobile-game-controls" id="mobileControls" style="display: none;">
          <div class="control-row">
            <button class="control-btn" onclick="handleMobileControl('up')">▲</button>
          </div>
          <div class="control-row">
            <button class="control-btn" onclick="handleMobileControl('left')">◀</button>
            <button class="control-btn" onclick="handleMobileControl('rotate')">↻</button>
            <button class="control-btn" onclick="handleMobileControl('right')">▶</button>
          </div>
          <div class="control-row">
            <button class="control-btn" onclick="handleMobileControl('down')">▼</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Game Over Overlay -->
  <div id="gameOverOverlay" class="game-over-overlay" style="display: none;">
    <div class="game-over-box">
      <div class="game-over-title" id="gameOverTitle">Game Over!</div>
      <div class="game-over-message" id="gameOverMessage">Final Score: 0</div>
      <div class="game-over-buttons">
        <button class="btn btn-restart" onclick="restartGame()">Play Again</button>
        <button class="btn btn-menu" onclick="backToCoding()" id="backToCodeBtn">Back to Coding</button>
      </div>
    </div>
  </div>


  <script>
    var CHALLENGES = [];
    async function downloadChallenges() {
      CHALLENGES = []
      for (let cat of ['algorithm', 'array', 'backtracking', 'dictionary', 'dynamic-programming', 'graph', 'greedy', 'math', 'matrix', 'searching', 'sorting', 'stack', 'string', 'vector']) {
        let data = await fetch(`challenges/${cat}.json`);
        let challenges = JSON.parse(await data.text());
        CHALLENGES.push(...challenges);
      }
      CHALLENGES.sort((a, b) => a.id - b.id);
    }

    // Storage API fallback using localStorage
    window.storage = {
      get: function (key) {
        return new Promise(function (resolve, reject) {
          try {
            const value = localStorage.getItem(key);
            resolve(value ? { value: value } : null);
          } catch (error) {
            reject(error);
          }
        });
      },
      set: function (key, value, encrypt) {
        return new Promise(function (resolve, reject) {
          try {
            localStorage.setItem(key, value);
            resolve();
          } catch (error) {
            reject(error);
          }
        });
      },
      delete: function (key, encrypt) {
        return new Promise(function (resolve, reject) {
          try {
            localStorage.removeItem(key);
            resolve();
          } catch (error) {
            reject(error);
          }
        });
      }
    };

    let currentChallenge = 0;
    let editor = null;
    let pyodide = null;
    let pyodideLoaded = false;
    let storageLoaded = false;
    let selectedCategory = 'all';
    let filteredChallenges = [];

    // Initialize category filter
    function initializeCategoryFilter() {
      const categorySet = new Set();
      CHALLENGES.forEach(function (challenge) {
        categorySet.add(challenge.category);
      });

      const sortedCategories = Array.from(categorySet).sort();
      const categoryFilter = document.getElementById('categoryFilter');

      sortedCategories.forEach(function (category) {
        const option = document.createElement('option');
        option.value = category;
        option.textContent = category;
        categoryFilter.appendChild(option);
      });

      updateFilteredChallenges();
    }

    function updateFilteredChallenges() {
      if (selectedCategory === 'all') {
        filteredChallenges = CHALLENGES.map(function (_, index) { return index; });
      } else {
        filteredChallenges = [];
        CHALLENGES.forEach(function (challenge, index) {
          if (challenge.category === selectedCategory) {
            filteredChallenges.push(index);
          }
        });
      }
    }

    function filterByCategory() {
      selectedCategory = document.getElementById('categoryFilter').value;
      updateFilteredChallenges();

      // Visual indicator when filter is active
      const categoryFilter = document.getElementById('categoryFilter');
      if (selectedCategory === 'all') {
        categoryFilter.style.backgroundColor = '#fff';
        categoryFilter.style.borderColor = '#000';
      } else {
        categoryFilter.style.backgroundColor = '#4ecdc4';
        categoryFilter.style.borderColor = '#000';
      }

      // If current challenge is not in filtered list, go to first filtered challenge
      if (!filteredChallenges.includes(currentChallenge)) {
        if (filteredChallenges.length > 0) {
          changeChallenge(filteredChallenges[0]);
        }
      } else {
        // Just update the counter
        loadChallenge();
      }
    }

    function getNextFilteredChallenge() {
      const currentIndex = filteredChallenges.indexOf(currentChallenge);
      if (currentIndex < filteredChallenges.length - 1) {
        return filteredChallenges[currentIndex + 1];
      }
      return null;
    }

    function getPrevFilteredChallenge() {
      const currentIndex = filteredChallenges.indexOf(currentChallenge);
      if (currentIndex > 0) {
        return filteredChallenges[currentIndex - 1];
      }
      return null;
    }

    async function loadProgress() {
      // Check URL hash first (e.g., #5 for challenge 5)
      const hash = window.location.hash.slice(1); // Remove the '#'
      if (hash && !isNaN(hash)) {
        const hashChallenge = parseInt(hash) - 1; // Convert to 0-indexed
        if (hashChallenge >= 0 && hashChallenge < CHALLENGES.length) {
          currentChallenge = hashChallenge;
          storageLoaded = true;
          await loadChallenge();
          return;
        }
      }

      // Otherwise, load from storage
      try {
        const savedChallenge = await window.storage.get('current-challenge');
        if (savedChallenge) {
          currentChallenge = parseInt(savedChallenge.value);
        }
      } catch (error) {
        console.log('No saved progress');
      }
      storageLoaded = true;
      await loadChallenge();
    }

    async function loadChallenge() {
      const challenge = CHALLENGES[currentChallenge];
      document.getElementById('challengeTitle').textContent = challenge.title;
      document.getElementById('challengeDescription').textContent = challenge.description;

      // Update URL hash (1-indexed for user-friendly URLs)
      const newHash = '#' + (currentChallenge + 1);
      if (window.location.hash !== newHash) {
        window.location.hash = newHash;
      }

      // Check if challenge is completed
      const isCompleted = await isChallengeCompleted(currentChallenge);
      const fileName = (currentChallenge + 1) + '.py';
      const badge = isCompleted ? ' [done]' : '';
      document.getElementById('fileName').textContent = fileName + badge;
      document.getElementById('fileName').style.color = isCompleted ? '#4ecdc4' : '#ffd700';

      // Show actual challenge number, not filtered position
      document.getElementById('currentNum').textContent = currentChallenge + 1;
      document.getElementById('totalNum').textContent = filteredChallenges.length;

      // Color code the challenge counter based on difficulty
      const counter = document.querySelector('.challenge-counter');
      const difficulty = challenge.difficulty;
      let bgColor;

      if (difficulty <= 2) {
        // Easy: greenish
        bgColor = '#a9d3ab';
      } else if (difficulty <= 4) {
        // Medium: yellowish
        bgColor = '#ffd700';
      } else if (difficulty <= 6) {
        // Hard: orangeish
        bgColor = '#ffb347';
      } else {
        // Very Hard: reddish
        bgColor = '#ff8c8c';
      }

      counter.style.backgroundColor = bgColor;

      const testCasesDiv = document.getElementById('testCases');
      testCasesDiv.innerHTML = challenge.tests.map(function (test, idx) {
        // Format input display - if single argument, show it directly; if multiple, show with commas
        let inputDisplay;
        if (test.input.length === 1) {
          inputDisplay = JSON.stringify(test.input[0]);
        } else {
          inputDisplay = test.input.map(function (arg) { return JSON.stringify(arg); }).join(', ');
        }
        return '<div class="test-case"><div>Input: <code class="test-input">' + inputDisplay + '</code></div><div>Expected: <code class="test-expected">' + JSON.stringify(test.expected) + '</code></div></div>';
      }).join('');

      // Calculate filtered index for button states
      const currentFilteredIndex = filteredChallenges.indexOf(currentChallenge);
      document.getElementById('prevBtn').disabled = currentFilteredIndex === 0;
      document.getElementById('nextBtn').disabled = currentFilteredIndex === filteredChallenges.length - 1;

      let code;
      try {
        const savedCode = await window.storage.get('challenge-' + currentChallenge);
        code = savedCode ? savedCode.value : challenge.starterCode;
      } catch (error) {
        code = challenge.starterCode;
      }

      if (editor) {
        editor.setValue(code);
      }

      document.getElementById('output').textContent = '';
      document.getElementById('testResults').innerHTML = '';
    }

    async function changeChallenge(index) {
      if (index === currentChallenge) return; // Avoid unnecessary updates
      currentChallenge = index;
      try {
        await window.storage.set('current-challenge', index.toString(), false);
      } catch (error) {
        console.error('Failed to save challenge index');
      }
      await loadChallenge();
    }

    function prevChallenge() {
      const prevIndex = getPrevFilteredChallenge();
      if (prevIndex !== null) {
        changeChallenge(prevIndex);
      }
    }

    function nextChallenge() {
      const nextIndex = getNextFilteredChallenge();
      if (nextIndex !== null) {
        changeChallenge(nextIndex);
      }
    }

    function askClaude() {
      const challenge = CHALLENGES[currentChallenge];
      const userCode = editor ? editor.getValue() : challenge.starterCode;

      // Format test cases nicely
      let testCasesText = challenge.tests.map(function (test, idx) {
        let inputDisplay;
        if (test.input.length === 1) {
          inputDisplay = JSON.stringify(test.input[0]);
        } else {
          inputDisplay = test.input.map(function (arg) { return JSON.stringify(arg); }).join(', ');
        }
        return 'Test ' + (idx + 1) + ':\n  Input: ' + inputDisplay + '\n  Expected Output: ' + JSON.stringify(test.expected);
      }).join('\n\n');

      // Create a well-structured educational prompt
      const prompt = `I'm learning Python and I'm stuck on this coding challenge. I need help understanding how to solve it, not just the answer.

**Challenge: ${challenge.title}**
Category: ${challenge.category}
Difficulty: ${challenge.difficulty}/10
Tags: ${challenge.tags.join(', ')}

**Problem Description:**
${challenge.description}

**Test Cases:**
${testCasesText}

**My Current Code:**
\`\`\`python
${userCode}
\`\`\`

**Please help me by:**
1. First, help me understand what the problem is really asking for in simple terms
2. Break down the problem into smaller steps I need to solve
3. Guide me through the thought process and algorithm/approach needed
4. Explain any key concepts or patterns I should understand
5. Point out what might be wrong with my current approach (if applicable)
6. Give me hints to guide me toward the solution, rather than giving me the complete answer
7. Help me understand why this approach works and when I might use similar patterns in the future

Please be patient and explain things clearly - I'm here to learn and understand deeply, not just copy code. Thank you! 🙏`;

      // URL encode the prompt
      const encodedPrompt = encodeURIComponent(prompt);

      // Open Claude with the pre-filled prompt
      window.open('https://claude.ai/new?q=' + encodedPrompt, '_blank');
    }

    async function resetChallenge() {
      const challenge = CHALLENGES[currentChallenge];
      editor.setValue(challenge.starterCode);
      document.getElementById('output').textContent = '';
      document.getElementById('testResults').innerHTML = '';

      try {
        await window.storage.delete('challenge-' + currentChallenge, false);
      } catch (error) {
        console.error('Failed to delete saved code');
      }
    }

    async function saveCode(code) {
      try {
        await window.storage.set('challenge-' + currentChallenge, code, false);
      } catch (error) {
        console.error('Failed to save code');
      }
    }

    async function markChallengeCompleted(challengeIndex) {
      try {
        await window.storage.set('completed-' + challengeIndex, 'true', false);
      } catch (error) {
        console.error('Failed to save completion status');
      }
    }

    async function isChallengeCompleted(challengeIndex) {
      try {
        const result = await window.storage.get('completed-' + challengeIndex);
        return result && result.value === 'true';
      } catch (error) {
        return false;
      }
    }

    function areEqual(actual, expected, epsilon = 0.00001) {
      // Handle null/undefined
      if (actual === expected) return true;
      if (actual == null || expected == null) return false;

      // Handle numbers with floating point tolerance
      if (typeof actual === 'number' && typeof expected === 'number') {
        if (Number.isInteger(actual) && Number.isInteger(expected)) {
          return actual === expected;
        }
        return Math.abs(actual - expected) < epsilon;
      }

      // Handle arrays
      if (Array.isArray(actual) && Array.isArray(expected)) {
        if (actual.length !== expected.length) return false;
        for (let i = 0; i < actual.length; i++) {
          if (!areEqual(actual[i], expected[i], epsilon)) return false;
        }
        return true;
      }

      // Handle objects/dictionaries
      if (typeof actual === 'object' && typeof expected === 'object') {
        const actualKeys = Object.keys(actual).sort();
        const expectedKeys = Object.keys(expected).sort();
        if (JSON.stringify(actualKeys) !== JSON.stringify(expectedKeys)) return false;
        for (const key of actualKeys) {
          if (!areEqual(actual[key], expected[key], epsilon)) return false;
        }
        return true;
      }

      // Default comparison
      return actual === expected;
    }

    async function submitCode() {
      if (!pyodideLoaded) {
        document.getElementById('output').textContent = 'Python runtime is still loading...';
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      const submitBtnMobile = document.getElementById('submitBtnMobile');
      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Running...';
      submitBtnMobile.disabled = true;
      submitBtnMobile.innerHTML = 'Running...';

      document.getElementById('output').textContent = '';
      document.getElementById('testResults').innerHTML = '';

      const challenge = CHALLENGES[currentChallenge];
      const code = editor.getValue();
      const results = [];

      try {
        await pyodide.runPythonAsync('import sys\nfrom io import StringIO\nsys.stdout = StringIO()\nsys.stderr = StringIO()');

        await pyodide.runPythonAsync(code);

        for (let i = 0; i < challenge.tests.length; i++) {
          const test = challenge.tests[i];
          try {
            const funcName = code.match(/def\s+(\w+)\s*\(/)[1];
            const args = JSON.stringify(test.input);
            const result = await pyodide.runPythonAsync('import json; json.dumps(' + funcName + '(*' + args + '))');
            const parsed = JSON.parse(result);
            const passed = areEqual(parsed, test.expected);

            results.push({
              passed: passed,
              input: test.input,
              expected: test.expected,
              actual: parsed
            });
          } catch (error) {
            results.push({
              passed: false,
              input: test.input,
              expected: test.expected,
              error: error.message
            });
          }
        }

        const stdout = await pyodide.runPythonAsync('sys.stdout.getvalue()');
        const stderr = await pyodide.runPythonAsync('sys.stderr.getvalue()');

        const passed = results.filter(function (r) { return r.passed; }).length;
        const total = results.length;

        let outputMsg = '';
        if (stdout) {
          outputMsg += 'Debug Output:\n' + stdout + '\n\n';
        }
        if (stderr) {
          outputMsg += 'Errors:\n' + stderr + '\n\n';
        }

        if (passed === total) {
          outputMsg += 'All tests passed! (' + passed + '/' + total + ')';
          // Mark challenge as completed
          await markChallengeCompleted(currentChallenge);
          // Update the filename badge
          const fileName = (currentChallenge + 1) + '.py';
          document.getElementById('fileName').textContent = fileName + ' [done]';
          document.getElementById('fileName').style.color = '#4ecdc4';
        } else {
          outputMsg += 'Tests passed: ' + passed + '/' + total;
        }

        document.getElementById('output').textContent = outputMsg;

        const testResultsHtml = results.map(function (result, idx) {
          // Format input display consistently
          let inputDisplay;
          if (result.input.length === 1) {
            inputDisplay = JSON.stringify(result.input[0]);
          } else {
            inputDisplay = result.input.map(function (arg) { return JSON.stringify(arg); }).join(', ');
          }
          return '<div class="test-result ' + (result.passed ? 'passed' : 'failed') + '"><div class="test-result-title">Test ' + (idx + 1) + ': ' + (result.passed ? 'Passed' : 'Failed') + '</div><div class="test-result-details"><div>Input: ' + inputDisplay + '</div><div>Expected: ' + JSON.stringify(result.expected) + '</div>' + (result.error ? '<div>Error: ' + result.error + '</div>' : '<div>Got: ' + JSON.stringify(result.actual) + '</div>') + '</div></div>';
        }).join('');

        document.getElementById('testResults').innerHTML = testResultsHtml;

      } catch (error) {
        document.getElementById('output').textContent = 'Error: ' + error.message;
      }

      submitBtn.disabled = false;
      submitBtn.innerHTML = 'Submit';
      submitBtnMobile.disabled = false;
      submitBtnMobile.innerHTML = 'Submit';
    }

    document.getElementById('loadingIndicator').style.display = 'flex';

    // Listen for hash changes (browser back/forward buttons, direct URL changes)
    window.addEventListener('hashchange', async function () {
      const hash = window.location.hash.slice(1);
      if (hash && !isNaN(hash)) {
        const hashChallenge = parseInt(hash) - 1;
        if (hashChallenge >= 0 && hashChallenge < CHALLENGES.length && hashChallenge !== currentChallenge) {
          await changeChallenge(hashChallenge);
        }
      }
    });

    require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.54.0/min/vs' } });

    // Wait for DOM to be fully ready
    window.addEventListener('DOMContentLoaded', async function () {
      // Initialize category filter
      await downloadChallenges();
      initializeCategoryFilter();

      require(['vs/editor/editor.main'], async function () {
        // Add a small delay to ensure Monaco is fully loaded
        await new Promise(resolve => setTimeout(resolve, 100));

        await loadProgress();

        const challenge = CHALLENGES[currentChallenge];
        let code;
        try {
          const savedCode = await window.storage.get('challenge-' + currentChallenge);
          code = savedCode ? savedCode.value : challenge.starterCode;
        } catch (error) {
          code = challenge.starterCode;
        }

        // Ensure the editor container exists
        const editorContainer = document.getElementById('editor');
        if (!editorContainer) {
          console.error('Editor container not found');
          return;
        }

        try {
          editor = monaco.editor.create(editorContainer, {
            value: code,
            language: 'python',
            theme: 'vs-dark',
            minimap: { enabled: false },
            fontSize: 15,
            lineNumbers: 'on',
            roundedSelection: false,
            scrollBeyondLastLine: false,
            automaticLayout: true
          });

          editor.onDidChangeModelContent(function () {
            saveCode(editor.getValue());
          });
        } catch (error) {
          console.error('Failed to create Monaco editor:', error);
        }
      });
    });

    loadPyodide({
      indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.28.3/full/'
    }).then(function (py) {
      pyodide = py;
      pyodideLoaded = true;
      document.getElementById('loadingIndicator').style.display = 'none';
      document.getElementById('submitBtn').disabled = false;
      document.getElementById('submitBtnMobile').disabled = false;
    });
  </script>
  <script src="games.js"></script>
</body>
